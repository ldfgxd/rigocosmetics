<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuidado Corporal - Glow Beauty Studio</title>
    <style>
        body { margin: 0; font-family: sans-serif; background-color: #fdf2f4; padding: 20px; }
        .contenedor { max-width: 1000px; margin: 0 auto; text-align: center; }
        
        .btn-regresar-arriba {
            display: inline-block;
            margin-bottom: 15px;
            color: #555;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }
        .btn-regresar-arriba:hover { color: #d81b60; text-decoration: underline; }

        .btn-regresar-abajo {
            display: inline-block;
            margin-top: 40px;
            color: #555;
            text-decoration: underline;
            font-weight: bold;
        }

        .grid-productos {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        
        .tarjeta {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        .tarjeta:hover { transform: scale(1.05); }
        .tarjeta img { width: 100%; height: 160px; object-fit: cover; border-radius: 8px; }
        .tarjeta p { font-weight: bold; color: #333; margin-top: 10px; }

        @media (min-width: 768px) {
            .grid-productos { grid-template-columns: repeat(4, 1fr); }
        }
    </style>
</head>
<body>

<div class="contenedor">
    <div>
        <a href="index.html" class="btn-regresar-arriba">← Regresar al inicio</a>
    </div>

    <h1>Cuidado Corporal</h1>
    <p style="color: #666; margin-bottom: 30px;">Explora nuestros productos y tratamientos corporales.</p>

    <div class="grid-productos">
        <div class="tarjeta"><img src="img/corporal1.jpg" alt="Corporal 1"><p>Producto 1</p></div>
        <div class="tarjeta"><img src="img/corporal2.jpg" alt="Corporal 2"><p>Producto 2</p></div>
        <div class="tarjeta"><img src="img/corporal3.jpg" alt="Corporal 3"><p>Producto 3</p></div>
        <div class="tarjeta"><img src="img/corporal4.jpg" alt="Corporal 4"><p>Producto 4</p></div>
        <div class="tarjeta"><img src="img/corporal5.jpg" alt="Corporal 5"><p>Producto 5</p></div>
        <div class="tarjeta"><img src="img/corporal6.jpg" alt="Corporal 6"><p>Producto 6</p></div>
        <div class="tarjeta"><img src="img/corporal7.jpg" alt="Corporal 7"><p>Producto 7</p></div>
        <div class="tarjeta"><img src="img/corporal8.jpg" alt="Corporal 8"><p>Producto 8</p></div>
        <div class="tarjeta"><img src="img/corporal9.jpg" alt="Corporal 9"><p>Producto 9</p></div>
        <div class="tarjeta"><img src="img/corporal10.jpg" alt="Corporal 10"><p>Producto 10</p></div>
    </div>

    <div>
        <a href="index.html" class="btn-regresar-abajo">← Regresar al inicio</a>
    </div>
</div>

</body>
</html>
