<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maquillaje - Glow Beauty Studio</title>
    <style>
        body { margin: 0; font-family: sans-serif; background-color: #fdf2f4; padding: 20px; }
        .contenedor { max-width: 1000px; margin: 0 auto; text-align: center; }
        
        /* Estilo de los enlaces de regreso */
        .btn-regresar-arriba {
            display: inline-block;
            margin-bottom: 15px;
            color: #555;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }
        .btn-regresar-arriba:hover { color: #d81b60; text-decoration: underline; }

        .btn-regresar-abajo {
            display: inline-block;
            margin-top: 40px;
            color: #555;
            text-decoration: underline;
            font-weight: bold;
        }

        /* Cuadrícula de tarjetas */
        .grid-productos {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2 columnas en celular */
            gap: 20px;
            margin-top: 20px;
        }
        
        .tarjeta {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        .tarjeta:hover { transform: scale(1.05); }
        .tarjeta img { width: 100%; height: 160px; object-fit: cover; border-radius: 8px; }
        .tarjeta p { font-weight: bold; color: #333; margin-top: 10px; }

        /* En computadoras se acomodan en 4 columnas */
        @media (min-width: 768px) {
            .grid-productos { grid-template-columns: repeat(4, 1fr); }
        }
    </style>
</head>
<body>

<div class="contenedor">
    <!-- Enlace de regreso arriba -->
    <div>
        <a href="index.html" class="btn-regresar-arriba">← Regresar al inicio</a>
    </div>

    <h1>Maquillaje</h1>
    <p style="color: #666; margin-bottom: 30px;">Explora nuestros productos disponibles.</p>

    <div class="grid-productos">
        <!-- Tarjetas del 1 al 10 con nombres mariX.jpg -->
        <div class="tarjeta"><img src="img/mari1.jpg" alt="Maquillaje 1"><p>Producto 1</p></div>
        <div class="tarjeta"><img src="img/mari2.jpg" alt="Maquillaje 2"><p>Producto 2</p></div>
        <div class="tarjeta"><img src="img/mari3.jpg" alt="Maquillaje 3"><p>Producto 3</p></div>
        <div class="tarjeta"><img src="img/mari4.jpg" alt="Maquillaje 4"><p>Producto 4</p></div>
        <div class="tarjeta"><img src="img/mari5.jpg" alt="Maquillaje 5"><p>Producto 5</p></div>
        <div class="tarjeta"><img src="img/mari6.jpg" alt="Maquillaje 6"><p>Producto 6</p></div>
        <div class="tarjeta"><img src="img/mari7.jpg" alt="Maquillaje 7"><p>Producto 7</p></div>
        <div class="tarjeta"><img src="img/mari8.jpg" alt="Maquillaje 8"><p>Producto 8</p></div>
        <div class="tarjeta"><img src="img/mari9.jpg" alt="Maquillaje 9"><p>Producto 9</p></div>
        <div class="tarjeta"><img src="img/mari10.jpg" alt="Maquillaje 10"><p>Producto 10</p></div>
    </div>

    <!-- Enlace de regreso abajo -->
    <div>
        <a href="index.html" class="btn-regresar-abajo">← Regresar al inicio</a>
    </div>
</div>

</body>
</html>
